name: Build mobile VLC-engine APK (experimental)
on:
  push:
    branches: [vlc]
    paths: ['mobile/**', '.github/workflows/mobile-vlc.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: mobile-vlc-build, cancel-in-progress: true }
defaults:
  run: { working-directory: mobile }
jobs:
  android:
    runs-on: ubuntu-latest
    env: { EXPO_PUBLIC_BUILD: '${{ github.run_number }}' }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-cleanup: on-success }
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Fix VLC Gradle config for AGP 9
        run: |
          node -e "
          const fs=require('fs');
          const file='node_modules/react-native-vlc-media-player/android/build.gradle';
          const source=fs.readFileSync(file,'utf8');
          const updated=source.replace('proguard-android.txt','proguard-android-optimize.txt');
          if (source === updated) throw new Error('Expected obsolete ProGuard file reference was not found');
          fs.writeFileSync(file,updated)"
      - run: npx tsc --noEmit
      - name: Bump versionCode
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));
          c.expo.android.versionCode=1000+Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
      - run: npx expo prebuild --platform android --no-install
        env: { CI: '1' }
      - name: Build release APK (arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OnePlay-Mobile-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: oneplay-android, path: mobile/OnePlay-Mobile-android.apk, if-no-files-found: error }

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-vlc-${{ github.run_number }}
          name: OnePlay Mobile VLC engine (experimental) ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/**/*.apk

name: Build mobile apps (Android APK + iOS IPA)
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: mobile-build, cancel-in-progress: true }
defaults:
  run: { working-directory: mobile }
jobs:
  android:
    runs-on: ubuntu-latest
    env: { EXPO_PUBLIC_BUILD: '${{ github.run_number }}' }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-cleanup: on-success }
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Bump versionCode
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));
          c.expo.android.versionCode=1000+Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
      - run: npx expo prebuild --platform android --no-install
        env: { CI: '1' }
      - name: Build release APK (arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OnePlay-Mobile-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: oneplay-android, path: mobile/OnePlay-Mobile-android.apk, if-no-files-found: error }

  ios:
    runs-on: macos-latest
    env: { EXPO_PUBLIC_BUILD: '${{ github.run_number }}' }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx expo prebuild --platform ios
        env: { CI: '1' }
      - name: Build unsigned release app
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
      - name: Package unsigned IPA
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry OnePlay-Mobile-ios-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with: { name: oneplay-ios, path: mobile/OnePlay-Mobile-ios-unsigned.ipa, if-no-files-found: error }

  release:
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: OnePlay Mobile build ${{ github.run_number }}
          prerelease: true
          files: files/*
          body: |
            ## OnePlay for phones
            - **Android:** `OnePlay-Mobile-android.apk`. Open it on your phone and allow installs from this source.
            - **iPhone/iPad:** `OnePlay-Mobile-ios-unsigned.ipa` is **unsigned**. Install it with AltStore or Sideloadly using your Apple ID (free accounts must reinstall every 7 days). It cannot be installed directly.
            Sideloaded and debug-signed builds, not store releases. Not tested on a physical device yet.

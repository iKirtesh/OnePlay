name: Build and release OnePlay
# Every push to main builds all three installers and publishes/updates the GitHub Release for the version in
# package.json (bump the version for a new release).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest,  name: linux }
          - { os: macos-latest,   name: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned unless the signing secrets below are set
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: List installers
        shell: bash
        run: ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: oneplay-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -lh installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: OnePlay ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows:** `OnePlay-*-win-x64.exe` (installer) or the portable `.exe`
            - **macOS (Apple Silicon and Intel):** `OnePlay-*-mac-universal.dmg`
            - **Ubuntu / Linux:** `OnePlay-*-linux-x86_64.AppImage` or the `.deb` (`sudo apt install ./OnePlay-*.deb` also installs mpv)

            OnePlay plays media with **mpv**. Install it first on Windows and macOS (see the README). These builds are unsigned; see the README for the first-launch steps.
